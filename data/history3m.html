<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Historique 3 Mois - Spa</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav { margin-bottom: 20px; }
        .btn { padding: 10px; background: #667eea; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="nav"><a href="/" class="btn">🏠 Retour Dashboard</a></div>
    <div class="card">
        <h2>📈 Évolution Spa (Min/Max Journalier)</h2>
        <canvas id="dailyChart" style="height: 400px;"></canvas>
        <div style="margin-top:20px;">
            <a href="/history/daily/csv" class="btn" style="background: #28a745;">📥 Sauvegarder CSV (Backup)</a>
        </div>
    </div>

    <script>
        fetch('/history/daily')
            .then(res => res.json())
            .then(data => {
                const labels = data.points.map(p => p.d);
                const minData = data.points.map(p => p.min);
                const maxData = data.points.map(p => p.max);
                const countData = data.points.map(p => p.c || 0);

                new Chart(document.getElementById('dailyChart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Max Spa (°C)',
                                data: maxData,
                                borderColor: '#dc3545',
                                backgroundColor: 'rgba(220, 53, 69, 0.1)',
                                fill: false,
                                tension: 0.1
                            },
                            {
                                label: 'Min Spa (°C)',
                                data: minData,
                                borderColor: '#007bff',
                                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                                fill: false,
                                tension: 0.1
                            },
                            {
                                label: "Fonctionnement Pompe (h)",
                                data: countData,
                                borderColor: '#28a745',
                                backgroundColor: 'rgba(40, 167, 69, 0.1)',
                                fill: true,
                                tension: 0.3,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: { tooltip: { mode: 'index', intersect: false } },
                        scales: { 
                            y: { 
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Température (°C)' } 
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: "Durée de marche (heures)" },
                                grid: { drawOnChartArea: false },
                                min: 0,
                                ticks: { stepSize: 1 }
                            }
                        }
                    }
                });
            });
    </script>
</body>
</html>
